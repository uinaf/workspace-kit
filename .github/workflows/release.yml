name: Release

# Canonical verify -> release on push to main. Publishing uses npm Trusted
# Publishing (OIDC): npmjs.com lists this workflow filename (release.yml)
# and the "release" environment as the package's trusted publisher. See
# docs/releasing.md. The release job body is the shared
# uinaf/.github release-npm workflow, which binds the release environment. Version push-back and GitHub Release writes use a
# short-lived uinaf-ci installation token. GitHub signs the App-authored
# version commit before semantic-release creates the tag.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: ".node-version"
          cache: true
          # vp install alone maps to `npm install`; frozen keeps CI on `npm ci`
          # semantics so lockfile drift fails loudly instead of re-resolving.
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run verify # vp check + vp test + vp pack + cli smoke

  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/scan.yml

  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: [verify, scan]
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing; the shared job needs it too
    uses: uinaf/.github/.github/workflows/release-npm.yml@main
    with:
      extra-plugins: |
        @semantic-release/commit-analyzer@13.0.1
        @semantic-release/release-notes-generator@14.1.1
        @semantic-release/npm@13.1.5
        @jno21/semantic-release-github-commit@1.0.1
        @semantic-release/exec@7.1.0
        @semantic-release/github@12.0.8
        conventional-changelog-conventionalcommits@9.3.1
    # The App credentials live on this repository's release Environment; the
    # shared job binds that Environment and reads them itself.
    secrets: inherit
