name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository]

  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: [verify]
    permissions:
      contents: read
      id-token: write
    uses: uinaf/.github/.github/workflows/release-npm.yml@d7b7f4ec4f167df83616cf08b04e7dc3e1d4ebd0 # v3.1.1
    with:
      extra-plugins: |
        @semantic-release/commit-analyzer@13.0.1
        @semantic-release/release-notes-generator@14.1.1
        @semantic-release/npm@13.1.5
        @semantic-release/exec@7.1.0
        @semantic-release/github@12.0.8
        conventional-changelog-conventionalcommits@9.3.1
    secrets:
      UINAF_CI_APP_PRIVATE_KEY: ${{ secrets.UINAF_CI_APP_PRIVATE_KEY }}
