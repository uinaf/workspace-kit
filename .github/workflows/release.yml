name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run verify

  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/scan.yml

  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: [verify, scan]
    permissions:
      contents: read
      id-token: write
    uses: uinaf/.github/.github/workflows/release-npm.yml@273d0888178ba4795605c440bef144d8882331fc # v1.0.0
    with:
      extra-plugins: |
        @semantic-release/commit-analyzer@13.0.1
        @semantic-release/release-notes-generator@14.1.1
        @semantic-release/npm@13.1.5
        @jno21/semantic-release-github-commit@1.0.1
        @semantic-release/exec@7.1.0
        @semantic-release/github@12.0.8
        conventional-changelog-conventionalcommits@9.3.1
    secrets:
      UINAF_CI_APP_PRIVATE_KEY: ${{ secrets.UINAF_CI_APP_PRIVATE_KEY }}
