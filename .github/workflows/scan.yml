name: Scan

# No push trigger: pull requests scan what the shared baseline needs (Gitleaks
# on the commits outside the PR base, TruffleHog on full history, Actionlint
# and Zizmor only when workflow or scanner configuration changes). The weekly
# run rescans full history and consults live state - TruffleHog reports only
# credentials it can verify, and zizmor's online audits read GitHub - so a
# secret that was inactive at commit time is caught once it becomes valid.
on:
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  # release.yml calls this as a pre-release gate; cancelling a queued
  # release's scan would fail that pipeline, so only races between
  # pull request runs are collapsed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    permissions:
      contents: read
    uses: uinaf/.github/.github/workflows/scan.yml@273d0888178ba4795605c440bef144d8882331fc # v1.0.0
