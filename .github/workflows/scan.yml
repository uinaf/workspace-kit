name: Scan

# No push trigger: pull requests already scan the full history, because the
# shared baseline checks out with `fetch-depth: 0`. The weekly schedule
# re-scans unchanged code so that detector rules published since the last run
# still find old material.
on:
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  # release.yml calls this as a pre-release gate; cancelling a queued
  # release's scan would fail that pipeline, so only races between
  # pull request runs are collapsed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    permissions:
      contents: read
    # Tracks main by design: baseline changes reach every adopter without a
    # pin bump per repository. The shared Renovate preset deliberately disables
    # updates for `uinaf/.github`, so a pin here would never move again.
    uses: uinaf/.github/.github/workflows/scan.yml@main
