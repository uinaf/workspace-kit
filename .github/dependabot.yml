# Keeps SHA-pinned actions and digest-pinned scanner image bases current with
# reviewable PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let new action releases bake before PRing them (supply-chain buffer).
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/.github/scanners"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
